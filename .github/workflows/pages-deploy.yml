name: "Blog"
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

  # Manual runs validate the selected branch without publishing it.
  workflow_dispatch:

permissions: {}

# Queue master updates without interrupting a running deployment. A newer PR
# commit can replace its older check, without affecting production.
concurrency:
  group: "blog-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Keep this name stable: master branch protection requires this check.
    name: Blog checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          rubygems: 3.6.9
          bundler-cache: true

      - name: Check article metadata
        run: bundle exec ruby scripts/check-content

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter --destination _site
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec ruby scripts/check-content _site
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy blog
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

description: WongLing 的个人博客。在小米中国区（销售）参谋部从事智能家居策略运营，具备一定软件工程能力，喜欢研究厨具。这里记录家庭实验室、代码与日常实践。
url: https://irunningm.github.io
github:
  username: irunningm
social:
  name: WongLing
  links:
  - https://github.com/irunningm
webmaster_verifications:
  google: null
  bing: null
  alexa: null
  yandex: null
  baidu: null
  facebook: null
analytics:
  google:
    id: null
  goatcounter:
    id: null
  umami:
    id: ebd78267-8cdc-485f-9209-8112ca140231
    domain: https://analytics.64.110.75.0.sslip.io
  matomo:
    id: null
    domain: null
  cloudflare:
    id: null
  fathom:
    id: null
pageviews:
  provider: null
theme_mode: null
cdn: null
avatar: https://github.com/irunningm.png
social_preview_image: null
toc: true
actions:
  edit_post:
    enabled: false
    url: ''
    static_url: false
comments:
  provider: null
  disqus:
    shortname: null
  utterances:
    repo: null
    issue_term: null
  giscus:
    repo: null
    repo_id: null
    category: null
    category_id: null
    mapping: null
    strict: null
    input_position: null
    lang: null
    reactions_enabled: null
assets:
  self_host:
    enabled: null
    env: null
pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths: null
paginate: 10
baseurl: ''
kramdown:
  footnote_backlink: '&#8617;&#xfe0e;'
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1
collections:
  tabs:
    output: true
    sort_by: order
defaults:
- scope:
    path: ''
    type: posts
  values:
    layout: post
    comments: true
    toc: true
    permalink: /:categories/:title/
- scope:
    path: _drafts
  values:
    comments: false
- scope:
    path: ''
    type: tabs
  values:
    layout: page
    permalink: /:title/
sass:
  style: compressed
compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs:
    - development
exclude:
- '*.gem'
- '*.gemspec'
- docs
- tools
- README.md
- LICENSE
- purgecss.js
- '*.config.js'
- package*.json
- scripts
- vendor
- Gemfile
- Gemfile.lock
- _site-preview
jekyll-archives:
  enabled:
  - categories
  - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
repository: irunningm/irunningm.github.io

# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: 家庭实验室 404
email:
description: >- # this means to ignore newlines until "baseurl:"
  把家当作技术实验场，记录每一次智能化改造。NAS、智能家居、自动化脚本，一切让家更聪明的尝试。
url: https://irunningm.github.io
baseurl: ""
twitter_username: irunningm
github_username: irunningm
minimal_mistakes_skin: dark
search: true
locale: zh-CN

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "irunningm"
  avatar : "https://github.com/irunningm.png"
  bio    : "这是我的 living lab。NAS、智能家居、自动化脚本——一切让家更聪明的尝试都在这里记录。"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/irunningm"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/irunningm"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      show_date: true
      date_format: "%Y-%m-%d"
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      show_date: false

# Social sharing
social:
  type: Person
  name: irunningm
  links:
    - https://github.com/irunningm

# Analytics (add your ID when ready)
# analytics:
#   provider: google-gtag
#   google:
#     tracking_id: G-XXXXXXXXXX
#     anonymize_ip: false

# Comments (using Giscus - GitHub Discussions based comments)
comments:
  provider: "giscus"
  giscus:
    repo: "irunningm/irunningm.github.io"
    repo_id: ""
    category: "Comments"
    category_id: ""
    mapping: "pathname"
    reactions_enabled: "1"
    theme: "dark"
    strict_matching: 1
    input_position: "top"
    loading: "lazy"
    lang: "zh-CN"

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
